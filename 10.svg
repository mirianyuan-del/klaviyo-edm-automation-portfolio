<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2320" viewBox="0 0 1000 2320" role="img" aria-labelledby="title desc">
  <title id="title">SCENT VAULT post-purchase flow</title>
  <desc id="desc">A post-purchase customer journey: order placed, candle care email after 3 days, review request after 10 days, cross-sell email after 30 days, and refill reminder after 60 days.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#18251f" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1000" height="2320" fill="#f7f7f4"/>

  <text x="100" y="86" fill="#61776a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">SCENT VAULT</text>
  <text x="100" y="145" fill="#202722" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">Post-purchase flow</text>
  <text x="100" y="184" fill="#66716a" font-family="Arial, Helvetica, sans-serif" font-size="21">Customer journey · timing shown from order date</text>

  <!-- Flow spine -->
  <line x1="500" y1="410" x2="500" y2="2165" stroke="#c8d0ca" stroke-width="3"/>

  <!-- Trigger -->
  <g filter="url(#shadow)">
    <rect x="90" y="220" width="820" height="190" rx="22" fill="#ffffff" stroke="#e4e9e5" stroke-width="2"/>
    <rect x="90" y="220" width="9" height="190" rx="4" fill="#717b75"/>
  </g>
  <circle cx="146" cy="275" r="22" fill="#eef1ef"/>
  <path d="M149 258l-13 20h10l-3 15 15-22h-11l2-13z" fill="#58635c"/>
  <text x="184" y="281" fill="#69736c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">TRIGGER</text>
  <text x="135" y="337" fill="#202722" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">When someone Placed Order</text>
  <rect x="135" y="359" width="153" height="31" rx="15" fill="#f0f2f0"/>
  <text x="211" y="380" text-anchor="middle" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="15">Profile filters</text>

  <!-- Wait 3 days -->
  <g filter="url(#shadow)">
    <rect x="310" y="470" width="380" height="78" rx="20" fill="#ffffff" stroke="#e4e9e5" stroke-width="2"/>
  </g>
  <circle cx="358" cy="509" r="18" fill="#eef1ef"/>
  <circle cx="358" cy="509" r="9" fill="none" stroke="#68736c" stroke-width="2.5"/>
  <path d="M358 503v7l5 3" fill="none" stroke="#68736c" stroke-width="2.5" stroke-linecap="round"/>
  <text x="390" y="518" fill="#202722" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Wait 3 days</text>

  <!-- Email 1 -->
  <g filter="url(#shadow)">
    <rect x="90" y="610" width="820" height="210" rx="22" fill="#ffffff" stroke="#e4e9e5" stroke-width="2"/>
    <rect x="90" y="610" width="9" height="210" rx="4" fill="#6d9d91"/>
  </g>
  <rect x="135" y="640" width="104" height="30" rx="15" fill="#eaf2ef"/>
  <text x="187" y="660" text-anchor="middle" fill="#426c60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">EMAIL · DAY 3</text>
  <text x="135" y="712" fill="#202722" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Candle care and usage guide</text>
  <text x="135" y="751" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="21">Get a better burn from your SCENT VAULT candle</text>
  <rect x="135" y="773" width="145" height="28" rx="14" fill="#f0f2f0"/>
  <text x="207" y="792" text-anchor="middle" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="14">Smart sending</text>
  <rect x="808" y="773" width="70" height="28" rx="14" fill="#f3f3f1"/>
  <circle cx="824" cy="787" r="5" fill="#6c746f"/>
  <text x="849" y="792" text-anchor="middle" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="14">Draft</text>

  <!-- Wait 7 days -->
  <g filter="url(#shadow)">
    <rect x="310" y="880" width="380" height="78" rx="20" fill="#ffffff" stroke="#e4e9e5" stroke-width="2"/>
  </g>
  <circle cx="358" cy="919" r="18" fill="#eef1ef"/>
  <circle cx="358" cy="919" r="9" fill="none" stroke="#68736c" stroke-width="2.5"/>
  <path d="M358 913v7l5 3" fill="none" stroke="#68736c" stroke-width="2.5" stroke-linecap="round"/>
  <text x="390" y="928" fill="#202722" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Wait 7 days</text>

  <!-- Email 2 -->
  <g filter="url(#shadow)">
    <rect x="90" y="1020" width="820" height="210" rx="22" fill="#ffffff" stroke="#e4e9e5" stroke-width="2"/>
    <rect x="90" y="1020" width="9" height="210" rx="4" fill="#6d9d91"/>
  </g>
  <rect x="135" y="1050" width="120" height="30" rx="15" fill="#eaf2ef"/>
  <text x="195" y="1070" text-anchor="middle" fill="#426c60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">EMAIL · DAY 10</text>
  <text x="135" y="1122" fill="#202722" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Review request</text>
  <text x="135" y="1161" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="21">How are you enjoying your SCENT VAULT candle?</text>
  <rect x="135" y="1183" width="145" height="28" rx="14" fill="#f0f2f0"/>
  <text x="207" y="1202" text-anchor="middle" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="14">Smart sending</text>
  <rect x="808" y="1183" width="70" height="28" rx="14" fill="#f3f3f1"/>
  <circle cx="824" cy="1197" r="5" fill="#6c746f"/>
  <text x="849" y="1202" text-anchor="middle" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="14">Draft</text>

  <!-- Wait 20 days -->
  <g filter="url(#shadow)">
    <rect x="310" y="1290" width="380" height="78" rx="20" fill="#ffffff" stroke="#e4e9e5" stroke-width="2"/>
  </g>
  <circle cx="358" cy="1329" r="18" fill="#eef1ef"/>
  <circle cx="358" cy="1329" r="9" fill="none" stroke="#68736c" stroke-width="2.5"/>
  <path d="M358 1323v7l5 3" fill="none" stroke="#68736c" stroke-width="2.5" stroke-linecap="round"/>
  <text x="390" y="1338" fill="#202722" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Wait 20 days</text>

  <!-- Email 3 -->
  <g filter="url(#shadow)">
    <rect x="90" y="1430" width="820" height="210" rx="22" fill="#ffffff" stroke="#e4e9e5" stroke-width="2"/>
    <rect x="90" y="1430" width="9" height="210" rx="4" fill="#6d9d91"/>
  </g>
  <rect x="135" y="1460" width="120" height="30" rx="15" fill="#eaf2ef"/>
  <text x="195" y="1480" text-anchor="middle" fill="#426c60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">EMAIL · DAY 30</text>
  <text x="135" y="1532" fill="#202722" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Cross-sell recommendations</text>
  <text x="135" y="1571" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="21">Ready for a new scent?</text>
  <rect x="135" y="1593" width="145" height="28" rx="14" fill="#f0f2f0"/>
  <text x="207" y="1612" text-anchor="middle" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="14">Smart sending</text>
  <rect x="808" y="1593" width="70" height="28" rx="14" fill="#f3f3f1"/>
  <circle cx="824" cy="1607" r="5" fill="#6c746f"/>
  <text x="849" y="1612" text-anchor="middle" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="14">Draft</text>

  <!-- Wait 30 days -->
  <g filter="url(#shadow)">
    <rect x="310" y="1700" width="380" height="78" rx="20" fill="#ffffff" stroke="#e4e9e5" stroke-width="2"/>
  </g>
  <circle cx="358" cy="1739" r="18" fill="#eef1ef"/>
  <circle cx="358" cy="1739" r="9" fill="none" stroke="#68736c" stroke-width="2.5"/>
  <path d="M358 1733v7l5 3" fill="none" stroke="#68736c" stroke-width="2.5" stroke-linecap="round"/>
  <text x="390" y="1748" fill="#202722" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Wait 30 days</text>

  <!-- Email 4 -->
  <g filter="url(#shadow)">
    <rect x="90" y="1840" width="820" height="210" rx="22" fill="#ffffff" stroke="#e4e9e5" stroke-width="2"/>
    <rect x="90" y="1840" width="9" height="210" rx="4" fill="#6d9d91"/>
  </g>
  <rect x="135" y="1870" width="120" height="30" rx="15" fill="#eaf2ef"/>
  <text x="195" y="1890" text-anchor="middle" fill="#426c60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">EMAIL · DAY 60</text>
  <text x="135" y="1942" fill="#202722" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Refill or repeat-purchase reminder</text>
  <rect x="135" y="1964" width="180" height="32" rx="8" fill="#f0f2f0"/>
  <text x="225" y="1986" text-anchor="middle" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="15">Set up email</text>
  <rect x="135" y="2007" width="145" height="28" rx="14" fill="#f0f2f0"/>
  <text x="207" y="2026" text-anchor="middle" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="14">Smart sending</text>
  <rect x="808" y="2007" width="70" height="28" rx="14" fill="#f3f3f1"/>
  <circle cx="824" cy="2021" r="5" fill="#6c746f"/>
  <text x="849" y="2026" text-anchor="middle" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="14">Draft</text>

  <!-- End -->
  <rect x="450" y="2165" width="100" height="44" rx="22" fill="#e8ece9"/>
  <text x="500" y="2194" text-anchor="middle" fill="#58635c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">END</text>
</svg>
