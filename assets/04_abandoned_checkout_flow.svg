<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2360" viewBox="0 0 1400 2360" role="img" aria-labelledby="title desc">
  <title id="title">Checkout reminder flow</title>
  <desc id="desc">A vector redraw of the supplied Klaviyo checkout flow: checkout started, wait 30 minutes, cart reminder, wait 20 hours, order check, shipping/returns/scent FAQ, another order check, and a 48-hour offer. Purchased branches end.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.25" fill="#dfe5e0"/></pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1d2a24" flood-opacity="0.08"/></filter>
    <style>
      .ui{font-family:Arial,Helvetica,sans-serif;fill:#202722}.muted{font-family:Arial,Helvetica,sans-serif;fill:#657169}
      .card{fill:#fff;stroke:#dfe6e1;stroke-width:2}.line{stroke:#bfcac2;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1400" height="2360" fill="#f8faf8"/><rect width="1400" height="2360" fill="url(#dots)" opacity=".7"/>

  <!-- Trigger -->
  <g filter="url(#shadow)"><rect class="card" x="450" y="50" width="500" height="145" rx="22"/></g>
  <circle cx="505" cy="94" r="23" fill="#59645d"/><path d="M509 74l-15 24h12l-3 18 18-27h-13z" fill="#fff"/>
  <text class="ui" x="548" y="101" font-size="22" font-weight="700">Trigger</text>
  <text class="ui" x="490" y="144" font-size="21">When someone Checkout Started</text>
  <rect x="490" y="156" width="152" height="27" rx="13.5" fill="#eef1ef"/><text class="muted" x="566" y="175" text-anchor="middle" font-size="14">Profile filters</text>

  <!-- Wait 30 min -->
  <path class="line" d="M700 195v34"/><circle cx="700" cy="252" r="22" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="700" y="261" text-anchor="middle" font-size="27">+</text><path class="line" d="M700 274v25"/>
  <g filter="url(#shadow)"><rect class="card" x="540" y="299" width="320" height="78" rx="18"/></g>
  <circle cx="580" cy="338" r="17" fill="#edf1ee"/><circle cx="580" cy="338" r="9" fill="none" stroke="#68736c" stroke-width="2.5"/><path d="M580 332v7l5 3" fill="none" stroke="#68736c" stroke-width="2.5" stroke-linecap="round"/>
  <text class="ui" x="613" y="346" font-size="22" font-weight="700">Wait 30 min</text>

  <!-- Cart reminder email -->
  <path class="line" d="M700 377v35"/><circle cx="700" cy="435" r="22" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="700" y="444" text-anchor="middle" font-size="27">+</text><path class="line" d="M700 457v24"/>
  <g filter="url(#shadow)"><rect class="card" x="450" y="481" width="500" height="190" rx="20"/><rect x="450" y="481" width="9" height="190" rx="4" fill="#6b9b8e"/></g>
  <rect x="485" y="512" width="34" height="30" rx="7" fill="#e9f3ef"/><path d="M492 520h20v14h-20zM492 520l10 8 10-8" fill="none" stroke="#4c8b7a" stroke-width="2"/>
  <text class="ui" x="540" y="534" font-size="22" font-weight="700">Cart reminder</text>
  <text class="ui" x="485" y="582" font-size="20">Your SCENT VAULT picks are waiting</text>
  <rect x="485" y="610" width="145" height="28" rx="14" fill="#f0f2f0"/><text class="muted" x="557" y="629" text-anchor="middle" font-size="14">Smart sending</text>
  <rect x="823" y="610" width="92" height="28" rx="14" fill="#f3f4f2"/><circle cx="840" cy="624" r="5" fill="#68736c"/><text class="muted" x="874" y="629" text-anchor="middle" font-size="14">Draft</text>
  <text class="muted" x="454" y="700" font-size="18">ϟ Day 0</text>

  <!-- Wait 20 hours -->
  <path class="line" d="M700 671v38"/><circle cx="700" cy="731" r="22" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="700" y="740" text-anchor="middle" font-size="27">+</text><path class="line" d="M700 753v25"/>
  <g filter="url(#shadow)"><rect class="card" x="540" y="778" width="320" height="78" rx="18"/></g>
  <circle cx="580" cy="817" r="17" fill="#edf1ee"/><circle cx="580" cy="817" r="9" fill="none" stroke="#68736c" stroke-width="2.5"/><path d="M580 811v7l5 3" fill="none" stroke="#68736c" stroke-width="2.5" stroke-linecap="round"/>
  <text class="ui" x="613" y="825" font-size="22" font-weight="700">Wait 20 hours</text>

  <!-- First order check -->
  <path class="line" d="M700 856v35"/><circle cx="700" cy="914" r="22" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="700" y="923" text-anchor="middle" font-size="27">+</text><path class="line" d="M700 936v24"/>
  <g filter="url(#shadow)"><rect class="card" x="450" y="960" width="500" height="112" rx="20"/></g>
  <path d="M487 992l12 12 12-12m-24 0v25h24v-25" fill="none" stroke="#8a9990" stroke-width="2.5"/>
  <text class="ui" x="535" y="1002" font-size="21" font-weight="700">Placed Order since starting</text>
  <text class="ui" x="535" y="1031" font-size="21" font-weight="700">this flow?</text>

  <!-- First split -->
  <path class="line" d="M700 1072v35M700 1107H390v35M700 1107h310v35"/>
  <g filter="url(#shadow)"><rect class="card" x="70" y="1142" width="640" height="105" rx="18"/><rect class="card" x="790" y="1142" width="440" height="78" rx="18"/></g>
  <circle cx="105" cy="1175" r="16" fill="#edf1ee"/><text class="muted" x="105" y="1181" text-anchor="middle" font-size="13" font-weight="700">1</text>
  <text class="ui" x="140" y="1183" font-size="20" font-weight="700">No purchase after 20 hours</text>
  <text class="muted" x="105" y="1218" font-size="17">Has Placed Order zero times since start...</text>
  <circle cx="825" cy="1181" r="16" fill="#edf1ee"/><text class="muted" x="825" y="1187" text-anchor="middle" font-size="13" font-weight="700">2</text>
  <text class="ui" x="860" y="1189" font-size="20" font-weight="700">Everyone else</text>

  <!-- First branch: shipping, returns and scent FAQ email -->
  <path class="line" d="M390 1247v32"/><circle cx="390" cy="1301" r="22" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="390" y="1310" text-anchor="middle" font-size="27">+</text><path class="line" d="M390 1323v23"/>
  <g filter="url(#shadow)"><rect class="card" x="70" y="1346" width="640" height="205" rx="20"/><rect x="70" y="1346" width="9" height="205" rx="4" fill="#6b9b8e"/></g>
  <rect x="105" y="1377" width="34" height="30" rx="7" fill="#e9f3ef"/><path d="M112 1385h20v14h-20zM112 1385l10 8 10-8" fill="none" stroke="#4c8b7a" stroke-width="2"/>
  <text class="ui" x="160" y="1399" font-size="20" font-weight="700">Shipping / returns / scent</text>
  <text class="ui" x="160" y="1425" font-size="20" font-weight="700">FAQ</text>
  <rect x="105" y="1441" width="180" height="32" rx="8" fill="#f0f2f0"/><text class="muted" x="195" y="1463" text-anchor="middle" font-size="15">Set up email</text>
  <rect x="105" y="1482" width="145" height="28" rx="14" fill="#f0f2f0"/><text class="muted" x="177" y="1501" text-anchor="middle" font-size="14">Smart sending</text>
  <rect x="543" y="1482" width="92" height="28" rx="14" fill="#f3f4f2"/><circle cx="560" cy="1496" r="5" fill="#68736c"/><text class="muted" x="594" y="1501" text-anchor="middle" font-size="14">Draft</text>
  <text class="muted" x="74" y="1581" font-size="18">ϟ Day 0</text>

  <!-- Other branch ends -->
  <path class="line" d="M1010 1220v34"/><circle cx="1010" cy="1276" r="22" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="1010" y="1285" text-anchor="middle" font-size="27">+</text><path class="line" d="M1010 1298v30"/>
  <path d="M992 1330h13v15h-13zm18 0h13v15h-13z" fill="#f1f3f1" stroke="#aeb9b1" stroke-width="1.5"/><path d="M997 1341l4-5 4 4m10-6h7m-7 4h7" fill="none" stroke="#7d8981" stroke-width="1.5"/><path class="line" d="M1010 1345v25"/>
  <rect x="984" y="1370" width="52" height="29" rx="14" fill="#e8ece9"/><text class="muted" x="1010" y="1390" text-anchor="middle" font-size="14" font-weight="700">End</text>

  <!-- Second order check -->
  <path class="line" d="M390 1551v36"/><circle cx="390" cy="1609" r="22" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="390" y="1618" text-anchor="middle" font-size="27">+</text><path class="line" d="M390 1631v22"/>
  <g filter="url(#shadow)"><rect class="card" x="70" y="1653" width="640" height="112" rx="20"/></g>
  <path d="M107 1685l12 12 12-12m-24 0v25h24v-25" fill="none" stroke="#8a9990" stroke-width="2.5"/>
  <text class="ui" x="155" y="1695" font-size="21" font-weight="700">Placed Order since starting</text>
  <text class="ui" x="155" y="1724" font-size="21" font-weight="700">this flow?</text>

  <!-- Second split -->
  <path class="line" d="M390 1765v34M390 1799H245v34M390 1799h290v34"/>
  <g filter="url(#shadow)"><rect class="card" x="35" y="1833" width="420" height="105" rx="18"/><rect class="card" x="530" y="1833" width="300" height="78" rx="18"/></g>
  <circle cx="70" cy="1866" r="16" fill="#edf1ee"/><text class="muted" x="70" y="1872" text-anchor="middle" font-size="13" font-weight="700">1</text>
  <text class="ui" x="105" y="1874" font-size="20" font-weight="700">Path #1</text>
  <text class="muted" x="70" y="1910" font-size="16">Has Placed Order zero times since start...</text>
  <circle cx="565" cy="1872" r="16" fill="#edf1ee"/><text class="muted" x="565" y="1878" text-anchor="middle" font-size="13" font-weight="700">2</text>
  <text class="ui" x="600" y="1880" font-size="20" font-weight="700">Everyone else</text>
  <path class="line" d="M680 1911v36"/><circle cx="680" cy="1969" r="22" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="680" y="1978" text-anchor="middle" font-size="27">+</text><path class="line" d="M680 1991v22"/>
  <path d="M662 2014h13v15h-13zm19 0h13v15h-13z" fill="#f1f3f1" stroke="#aeb9b1" stroke-width="1.5"/><path d="M667 2025l4-5 4 4m10-6h7m-7 4h7" fill="none" stroke="#7d8981" stroke-width="1.5"/><path class="line" d="M680 2029v25"/>
  <rect x="654" y="2054" width="52" height="29" rx="14" fill="#e8ece9"/><text class="muted" x="680" y="2074" text-anchor="middle" font-size="14" font-weight="700">End</text>

  <!-- 48-hour offer -->
  <path class="line" d="M245 1938v27"/><circle cx="245" cy="1987" r="22" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="245" y="1996" text-anchor="middle" font-size="27">+</text><path class="line" d="M245 2009v20"/>
  <g filter="url(#shadow)"><rect class="card" x="35" y="2029" width="420" height="168" rx="20"/><rect x="35" y="2029" width="9" height="168" rx="4" fill="#6b9b8e"/></g>
  <rect x="70" y="2058" width="34" height="30" rx="7" fill="#e9f3ef"/><path d="M77 2066h20v14H77zM77 2066l10 8 10-8" fill="none" stroke="#4c8b7a" stroke-width="2"/>
  <text class="ui" x="125" y="2080" font-size="21" font-weight="700">48-hour offer</text>
  <text class="ui" x="70" y="2120" font-size="18">Your 10% offer ends soon</text>
  <rect x="70" y="2140" width="145" height="28" rx="14" fill="#f0f2f0"/><text class="muted" x="142" y="2159" text-anchor="middle" font-size="14">Smart sending</text>
  <rect x="288" y="2140" width="92" height="28" rx="14" fill="#f3f4f2"/><circle cx="305" cy="2154" r="5" fill="#68736c"/><text class="muted" x="339" y="2159" text-anchor="middle" font-size="14">Draft</text>
  <text class="muted" x="39" y="2226" font-size="18">ϟ Day 0</text>
  <path class="line" d="M245 2197v42"/><circle cx="245" cy="2261" r="22" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="245" y="2270" text-anchor="middle" font-size="27">+</text><path class="line" d="M245 2283v17"/>
  <path d="M227 2301h13v15h-13zm19 0h13v15h-13z" fill="#f1f3f1" stroke="#aeb9b1" stroke-width="1.5"/><path d="M232 2312l4-5 4 4m10-6h7m-7 4h7" fill="none" stroke="#7d8981" stroke-width="1.5"/>
</svg>
