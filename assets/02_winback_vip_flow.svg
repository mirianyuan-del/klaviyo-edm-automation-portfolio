<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1880" viewBox="0 0 1600 1880" role="img" aria-labelledby="title desc">
  <title id="title">VIP customer flow</title>
  <desc id="desc">A clear vector redraw of the supplied Klaviyo flow with a VIP customer split, two branch emails, wait steps, purchase checks, follow-up emails, and end states.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#dfe5e0"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1d2a24" flood-opacity="0.08"/>
    </filter>
    <style>
      .ui { font-family: Arial, Helvetica, sans-serif; fill: #202722; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #657169; }
      .card { fill: #fff; stroke: #dfe6e1; stroke-width: 2; }
      .line { stroke: #bfcac2; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .branch { fill: #fff; stroke: #dfe6e1; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1880" fill="#f8faf8"/>
  <rect width="1600" height="1880" fill="url(#dots)" opacity="0.7"/>

  <!-- Main trigger and split -->
  <g filter="url(#shadow)">
    <rect class="card" x="550" y="45" width="500" height="150" rx="22"/>
  </g>
  <circle cx="602" cy="88" r="24" fill="#59645d"/>
  <path d="M606 68l-15 24h12l-3 18 18-27h-13z" fill="#fff"/>
  <text class="ui" x="645" y="95" font-size="22" font-weight="700">Trigger</text>
  <text class="ui" x="590" y="139" font-size="21">When someone is added to VIP Custo...</text>
  <rect x="590" y="154" width="152" height="27" rx="13.5" fill="#eef1ef"/>
  <text class="muted" x="666" y="173" text-anchor="middle" font-size="14">Profile filters</text>

  <path class="line" d="M800 195v37"/>
  <circle cx="800" cy="248" r="24" fill="#fff" stroke="#d5ded7" stroke-width="2"/>
  <text class="ui" x="800" y="257" text-anchor="middle" font-size="28">+</text>

  <g filter="url(#shadow)">
    <rect class="card" x="600" y="285" width="400" height="82" rx="18"/>
  </g>
  <path d="M635 317l12 12 12-12m-24 0v24h24v-24" fill="none" stroke="#91a098" stroke-width="2.5"/>
  <text class="ui" x="680" y="336" font-size="24" font-weight="700">Split #1</text>

  <!-- Split connector -->
  <path class="line" d="M800 367v52M800 419H400v36M800 419h400v36"/>

  <!-- Upper branch labels -->
  <g filter="url(#shadow)">
    <rect class="branch" x="90" y="455" width="620" height="120" rx="18"/>
    <rect class="branch" x="890" y="455" width="620" height="100" rx="18"/>
  </g>
  <circle cx="125" cy="490" r="17" fill="#edf1ee"/>
  <text class="muted" x="125" y="497" text-anchor="middle" font-size="14" font-weight="700">1</text>
  <text class="ui" x="165" y="500" font-size="22" font-weight="700">VIP Customer</text>
  <text class="muted" x="125" y="538" font-size="18">Has Placed Order is at least 2 overall times</text>
  <circle cx="925" cy="490" r="17" fill="#edf1ee"/>
  <text class="muted" x="925" y="497" text-anchor="middle" font-size="14" font-weight="700">2</text>
  <text class="ui" x="965" y="500" font-size="22" font-weight="700">Everyone else</text>

  <!-- Upper branch connectors -->
  <path class="line" d="M400 575v35M1200 555v55"/>
  <circle cx="400" cy="630" r="23" fill="#fff" stroke="#d5ded7" stroke-width="2"/>
  <text class="ui" x="400" y="639" text-anchor="middle" font-size="27">+</text>
  <circle cx="1200" cy="630" r="23" fill="#fff" stroke="#d5ded7" stroke-width="2"/>
  <text class="ui" x="1200" y="639" text-anchor="middle" font-size="27">+</text>
  <path class="line" d="M400 653v32M1200 653v32"/>

  <!-- Email card helper visuals: left -->
  <g filter="url(#shadow)">
    <rect class="card" x="90" y="685" width="620" height="205" rx="20"/>
    <rect x="90" y="685" width="9" height="205" rx="4" fill="#6b9b8e"/>
  </g>
  <rect x="125" y="716" width="34" height="30" rx="7" fill="#e9f3ef"/>
  <path d="M132 724h20v14h-20zM132 724l10 8 10-8" fill="none" stroke="#4c8b7a" stroke-width="2"/>
  <text class="ui" x="180" y="738" font-size="22" font-weight="700">Email</text>
  <text class="ui" x="125" y="790" font-size="22">A first look, reserved for you</text>
  <rect x="125" y="824" width="145" height="28" rx="14" fill="#f0f2f0"/>
  <text class="muted" x="197" y="843" text-anchor="middle" font-size="14">Smart sending</text>
  <rect x="583" y="824" width="92" height="28" rx="14" fill="#f3f4f2"/>
  <circle cx="600" cy="838" r="5" fill="#68736c"/>
  <text class="muted" x="634" y="843" text-anchor="middle" font-size="14">Draft</text>
  <text class="muted" x="95" y="925" font-size="18">ϟ Day 0</text>

  <!-- Email card right -->
  <g filter="url(#shadow)">
    <rect class="card" x="890" y="685" width="620" height="205" rx="20"/>
    <rect x="890" y="685" width="9" height="205" rx="4" fill="#6b9b8e"/>
  </g>
  <rect x="925" y="716" width="34" height="30" rx="7" fill="#e9f3ef"/>
  <path d="M932 724h20v14h-20zM932 724l10 8 10-8" fill="none" stroke="#4c8b7a" stroke-width="2"/>
  <text class="ui" x="980" y="738" font-size="22" font-weight="700">Email</text>
  <text class="ui" x="925" y="790" font-size="22">Ready to find a new favorite scent?</text>
  <rect x="925" y="824" width="145" height="28" rx="14" fill="#f0f2f0"/>
  <text class="muted" x="997" y="843" text-anchor="middle" font-size="14">Smart sending</text>
  <rect x="1383" y="824" width="92" height="28" rx="14" fill="#f3f4f2"/>
  <circle cx="1400" cy="838" r="5" fill="#68736c"/>
  <text class="muted" x="1434" y="843" text-anchor="middle" font-size="14">Draft</text>
  <text class="muted" x="895" y="925" font-size="18">ϟ Day 0</text>

  <!-- Waits -->
  <path class="line" d="M400 890v46M1200 890v46"/>
  <g filter="url(#shadow)">
    <rect class="card" x="260" y="936" width="280" height="78" rx="18"/>
    <rect class="card" x="1060" y="936" width="280" height="78" rx="18"/>
  </g>
  <circle cx="300" cy="975" r="17" fill="#edf1ee"/><circle cx="300" cy="975" r="9" fill="none" stroke="#68736c" stroke-width="2.5"/><path d="M300 969v7l5 3" fill="none" stroke="#68736c" stroke-width="2.5" stroke-linecap="round"/>
  <text class="ui" x="333" y="983" font-size="22" font-weight="700">Wait 5 days</text>
  <circle cx="1100" cy="975" r="17" fill="#edf1ee"/><circle cx="1100" cy="975" r="9" fill="none" stroke="#68736c" stroke-width="2.5"/><path d="M1100 969v7l5 3" fill="none" stroke="#68736c" stroke-width="2.5" stroke-linecap="round"/>
  <text class="ui" x="1133" y="983" font-size="22" font-weight="700">Wait 5 days</text>
  <path class="line" d="M400 1014v38M1200 1014v38"/>
  <circle cx="400" cy="1075" r="23" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="400" y="1084" text-anchor="middle" font-size="27">+</text>
  <circle cx="1200" cy="1075" r="23" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="1200" y="1084" text-anchor="middle" font-size="27">+</text>
  <path class="line" d="M400 1098v25M1200 1098v25"/>

  <!-- Purchase checks -->
  <g filter="url(#shadow)">
    <rect class="card" x="90" y="1123" width="620" height="130" rx="20"/>
    <rect class="card" x="890" y="1123" width="620" height="130" rx="20"/>
  </g>
  <path d="M125 1160l13 13 13-13m-26 0v27h26v-27" fill="none" stroke="#8a9990" stroke-width="2.5"/>
  <text class="ui" x="175" y="1172" font-size="21" font-weight="700">Placed Order at least once</text>
  <text class="ui" x="175" y="1204" font-size="21" font-weight="700">since starting this flow?</text>
  <path d="M925 1160l13 13 13-13m-26 0v27h26v-27" fill="none" stroke="#8a9990" stroke-width="2.5"/>
  <text class="ui" x="975" y="1172" font-size="21" font-weight="700">Placed Order at least once</text>
  <text class="ui" x="975" y="1204" font-size="21" font-weight="700">since starting this flow?</text>
  <path class="line" d="M400 1253v35M1200 1253v35"/>
  <path class="line" d="M400 1288H240v35M400 1288h160v35M1200 1288h-160v35M1200 1288h160v35"/>

  <!-- Lower branch labels -->
  <g filter="url(#shadow)">
    <rect class="branch" x="35" y="1323" width="410" height="105" rx="17"/>
    <rect class="branch" x="480" y="1323" width="300" height="78" rx="17"/>
    <rect class="branch" x="835" y="1323" width="410" height="105" rx="17"/>
    <rect class="branch" x="1280" y="1323" width="300" height="78" rx="17"/>
  </g>
  <circle cx="68" cy="1356" r="16" fill="#edf1ee"/><text class="muted" x="68" y="1362" text-anchor="middle" font-size="13" font-weight="700">1</text>
  <text class="ui" x="102" y="1365" font-size="19" font-weight="700">No purchase after 5 days</text>
  <text class="muted" x="68" y="1400" font-size="16">Has Placed Order zero times since start...</text>
  <circle cx="513" cy="1357" r="16" fill="#edf1ee"/><text class="muted" x="513" y="1363" text-anchor="middle" font-size="13" font-weight="700">2</text>
  <text class="ui" x="550" y="1365" font-size="19" font-weight="700">Everyone else</text>
  <circle cx="868" cy="1356" r="16" fill="#edf1ee"/><text class="muted" x="868" y="1362" text-anchor="middle" font-size="13" font-weight="700">1</text>
  <text class="ui" x="902" y="1365" font-size="19" font-weight="700">No purchase after 5 days</text>
  <text class="muted" x="868" y="1400" font-size="16">Has Placed Order zero times since start...</text>
  <circle cx="1313" cy="1357" r="16" fill="#edf1ee"/><text class="muted" x="1313" y="1363" text-anchor="middle" font-size="13" font-weight="700">2</text>
  <text class="ui" x="1350" y="1365" font-size="19" font-weight="700">Everyone else</text>

  <!-- Follow-up email cards -->
  <path class="line" d="M240 1428v35M1040 1428v35"/>
  <circle cx="240" cy="1485" r="23" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="240" y="1494" text-anchor="middle" font-size="27">+</text>
  <circle cx="1040" cy="1485" r="23" fill="#fff" stroke="#d5ded7" stroke-width="2"/><text class="ui" x="1040" y="1494" text-anchor="middle" font-size="27">+</text>
  <path class="line" d="M240 1508v25M1040 1508v25"/>
  <g filter="url(#shadow)">
    <rect class="card" x="35" y="1533" width="410" height="205" rx="20"/>
    <rect class="card" x="835" y="1533" width="410" height="205" rx="20"/>
  </g>
  <rect x="68" y="1564" width="34" height="30" rx="7" fill="#e9f3ef"/><path d="M75 1572h20v14H75zM75 1572l10 8 10-8" fill="none" stroke="#4c8b7a" stroke-width="2"/>
  <text class="ui" x="120" y="1586" font-size="21" font-weight="700">Email</text>
  <text class="ui" x="68" y="1635" font-size="21">Still thinking about your next scent?</text>
  <rect x="68" y="1670" width="145" height="28" rx="14" fill="#f0f2f0"/><text class="muted" x="140" y="1689" text-anchor="middle" font-size="14">Smart sending</text>
  <rect x="318" y="1670" width="92" height="28" rx="14" fill="#f3f4f2"/><circle cx="335" cy="1684" r="5" fill="#68736c"/><text class="muted" x="369" y="1689" text-anchor="middle" font-size="14">Draft</text>
  <text class="muted" x="40" y="1772" font-size="18">ϟ Day 5</text>

  <rect x="868" y="1564" width="34" height="30" rx="7" fill="#e9f3ef"/><path d="M875 1572h20v14h-20zM875 1572l10 8 10-8" fill="none" stroke="#4c8b7a" stroke-width="2"/>
  <text class="ui" x="920" y="1586" font-size="21" font-weight="700">Email</text>
  <text class="ui" x="868" y="1635" font-size="21">Still thinking about your next scent?</text>
  <rect x="868" y="1670" width="145" height="28" rx="14" fill="#f0f2f0"/><text class="muted" x="940" y="1689" text-anchor="middle" font-size="14">Smart sending</text>
  <rect x="1118" y="1670" width="92" height="28" rx="14" fill="#f3f4f2"/><circle cx="1135" cy="1684" r="5" fill="#68736c"/><text class="muted" x="1169" y="1689" text-anchor="middle" font-size="14">Draft</text>
  <text class="muted" x="840" y="1772" font-size="18">ϟ Day 5</text>

  <!-- Else paths end -->
  <path class="line" d="M630 1401v105M1430 1401v105"/>
  <path d="M620 1506l10 14 10-14" fill="none" stroke="#bfcac2" stroke-width="3"/>
  <path d="M1420 1506l10 14 10-14" fill="none" stroke="#bfcac2" stroke-width="3"/>
  <rect x="600" y="1520" width="60" height="31" rx="15" fill="#e8ece9"/><text class="muted" x="630" y="1541" text-anchor="middle" font-size="15" font-weight="700">End</text>
  <rect x="1400" y="1520" width="60" height="31" rx="15" fill="#e8ece9"/><text class="muted" x="1430" y="1541" text-anchor="middle" font-size="15" font-weight="700">End</text>

</svg>
